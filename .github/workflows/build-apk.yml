name: Сборка Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:          # ручной запуск: вкладка Actions → Run workflow

jobs:
  # 1. Быстрая проверка: собираем C++ ядро для компьютера и гоняем автотесты (около минуты)
  test-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Тесты ядра компилятора
        run: python tests/test_core.py

  # 2. Сборка APK (первый раз 30–60 минут, потом быстрее благодаря кэшу)
  build-apk:
    needs: test-core
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Системные пакеты
        run: | sudo apt-get update sudo apt-get install -y --no-install-recommends \ git zip unzip autoconf automake libtool pkg-config zlib1g-dev \ libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \ build-essential ccache 
      - name: Buildozer и Cython
        run: | python -m pip install --upgrade pip pip install buildozer "cython==0.29.36" virtualenv setuptools 
      - name: Кэш Android SDK/NDK и сборки
        uses: actions/cache@v4
        with:
          path: | ~/.buildozer .buildozer           key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: | buildozer-${{ runner.os }}- 
      - name: Сборка APK
        run: buildozer -v android debug

      - name: Сохранить APK
        uses: actions/upload-artifact@v4
        with:
          name: calc-ide-apk
          path: bin/*.apk
          if-no-files-found: error
