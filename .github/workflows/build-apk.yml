name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test-core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Test core
        run: python tests/test_core.py

  build-apk:
    needs: test-core
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
      - name: Python tools
        run: python -m pip install --upgrade pip buildozer cython==0.29.36 virtualenv setuptools
      - name: Cache Android SDK and NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-home-${{ hashFiles('buildozer.spec', 'recipes/**') }}
          restore-keys: buildozer-home-
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show error context
        if: failure()
        shell: bash
        run: 'N=$(grep -n "Command failed" build.log | tail -n 1 | cut -d: -f1 || true); if [ -n "$N" ]; then S=$((N>80?N-80:1)); sed -n "${S},${N}p" build.log | cut -c1-240; else tail -n 100 build.log | cut -c1-240; fi'
      - name: Show error lines
        if: failure()
        shell: bash
        run: 'grep -n -i -E "error:|\[error\]|traceback|undefined reference|fatal error|no such file|failed" build.log | grep -v -i -E "warning|deprecat" | tail -n 40 | cut -c1-240 || true'
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calc-ide-apk
          path: bin/*.apk
          if-no-files-found: error
